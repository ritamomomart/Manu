<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rita Momo Mart - Live Digital Menu</title>
    <!-- Firebase App & Firestore SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; margin: 0; padding: 10px; }
        .header { text-align: center; padding: 15px; background: #1f1f1f; border-radius: 8px; margin-bottom: 15px; }
        .item-card { background: #1e1e1e; border: 1px solid #333; border-radius: 8px; padding: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .badge-in { background: #d4edda; color: #155724; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .badge-out { background: #f8d7da; color: #721c24; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .contact-box { background: #222; padding: 15px; border-radius: 8px; margin-top: 20px; text-align: center; font-size: 14px; }
        .contact-box a { color: #25D366; text-decoration: none; font-weight: bold; font-size: 16px; }
    </style>
</head>
<body>

    <div class="header">
        <h2>রীতা মোমো মার্ট (Rita Momo Mart)</h2>
        <p>Narayan Pur (Mill More), Buniadpur</p>
        <p>Call: 9485949685, 9911437053, 8383923530</p>
        <a href="https://maps.app.goo.gl/AxpKtAtTFicX6jmo7" target="_blank" style="color: #4da6ff;">📍 View on Google Maps</a>
    </div>

    <div id="menu-container">
        <p style="text-align: center; color: #aaa;">Loading live menu from POS...</p>
    </div>

    <div class="contact-box">
        <p>🛒 Order Directly on WhatsApp:</p>
        <a href="https://wa.me/919485949685?text=Hi%20Rita%20Momo%20Mart!%20I%20want%20to%20order%20food">Chat on WhatsApp (9485949685)</a>
    </div>

    <script>
        // Firebase Configuration for Rita Momo Mart POS Sync
        const firebaseConfig = {
            projectId: "restaurantpos-vbmk"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // Real-time listener on POS room items
        db.collection("rooms").doc("RITA-MOMO-88").collection("items").onSnapshot((snapshot) => {
            const container = document.getElementById("menu-container");
            container.innerHTML = "";
            
            if(snapshot.empty) {
                container.innerHTML = "<p style='text-align:center; color:#888;'>No items found in menu.</p>";
                return;
            }

            snapshot.forEach((doc) => {
                const item = doc.data();
                const itemName = item.name || item.title || "Food Item";
                const itemCat = item.category || "General";
                
                // Stock logic check
                const isInStock = item.isAvailable !== false && (item.stockLeft === undefined || item.stockLeft > 0);
                
                const card = document.createElement("div");
                card.className = "item-card";
                card.innerHTML = `
                    <div>
                        <strong style="font-size: 16px;">${itemName}</strong><br>
                        <small style="color: #aaa;">Category: ${itemCat}</small>
                    </div>
                    <div>
                        <span class="${isInStock ? 'badge-in' : 'badge-out'}">
                            ${isInStock ? 'In Stock' : 'Out of Stock'}
                        </span>
                    </div>
                `;
                container.appendChild(card);
            });
        }, (error) => {
            console.error("Firestore Error: ", error);
            document.getElementById("menu-container").innerHTML = "<p style='text-align:center; color:red;'>Failed to load live stock.</p>";
        });
    </script>
</body>
</html>
