<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rita Momo Mart - ডিজিটাল মেনু</title>
  <style>
    :root {
      --bg: #141414;
      --card-bg: #1f1f1f;
      --card-border: #2d2d2d;
      --yellow: #f5b301;
      --red: #d32f2f;
      --whatsapp: #25d366;
      --text: #ffffff;
      --text-muted: #b0b0b0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Bengali", sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding-bottom: 120px;
    }

    header {
      background: linear-gradient(180deg, #1f1f1f 0%, #141414 100%);
      padding: 20px 16px;
      text-align: center;
      border-bottom: 2px solid var(--yellow);
    }

    .brand-logo {
      width: 85px;
      height: 85px;
      object-fit: contain;
      margin-bottom: 8px;
    }

    header h1 {
      color: var(--yellow);
      font-size: 1.5rem;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    header p {
      color: var(--red);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .categories {
      display: flex;
      overflow-x: auto;
      gap: 8px;
      padding: 12px 16px;
      background-color: var(--bg);
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid var(--card-border);
      scrollbar-width: none;
    }

    .categories::-webkit-scrollbar {
      display: none;
    }

    .cat-btn {
      background: #222222;
      border: 1px solid #333333;
      color: var(--text-muted);
      padding: 7px 14px;
      border-radius: 20px;
      white-space: nowrap;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .cat-btn.active {
      background-color: var(--yellow);
      color: #000;
      font-weight: 700;
      border-color: var(--yellow);
    }

    .menu-container {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-width: 600px;
      margin: 0 auto;
    }

    .item-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px;
    }

    .item-title {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .item-cat {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .portion-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 10px;
      background: #282828;
      border-radius: 8px;
      margin-top: 6px;
    }

    .portion-label {
      font-size: 0.9rem;
      font-weight: 500;
    }

    .portion-price {
      color: var(--yellow);
      font-weight: 700;
      margin-left: 8px;
    }

    .counter {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .counter button {
      background: #3a3a3a;
      border: none;
      color: #fff;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .counter button:active {
      background: var(--yellow);
      color: #000;
    }

    .qty-display {
      font-weight: 700;
      min-width: 18px;
      text-align: center;
    }

    .cart-drawer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #1c1c1c;
      border-top: 2px solid var(--yellow);
      padding: 12px 16px;
      z-index: 100;
      box-shadow: 0 -4px 15px rgba(0,0,0,0.5);
    }

    .customer-inputs {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }

    .customer-inputs input {
      background: #2b2b2b;
      border: 1px solid #444;
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
    }

    .customer-inputs input:focus {
      border-color: var(--yellow);
    }

    .input-name {
      flex: 2;
    }

    .input-detail {
      flex: 1.2;
    }

    .cart-action {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 600px;
      margin: 0 auto;
    }

    .total-box {
      display: flex;
      flex-direction: column;
    }

    .total-count {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .total-amount {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--yellow);
    }

    .order-btn {
      background: var(--whatsapp);
      color: #000;
      font-weight: 700;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .order-btn:disabled {
      background-color: #333333;
      color: #666666;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <!-- Brand Header -->
  <header>
    <img src="Logo.png" alt="Rita Momo Mart Logo" class="brand-logo" onerror="this.style.display='none'" />
    <div>
      <h1>রিতা মোমো মার্ট</h1>
      <p>FRESH • HYGIENE • DELICIOUS</p>
    </div>
  </header>

  <!-- Category Nav -->
  <div class="categories">
    <button class="cat-btn active" onclick="filterCat('all', this)">সব</button>
    <button class="cat-btn" onclick="filterCat('momo', this)">মোমো</button>
    <button class="cat-btn" onclick="filterCat('snacks', this)">স্ন্যাক্স ও পাকোড়া</button>
    <button class="cat-btn" onclick="filterCat('fastfood', this)">চাউমিন ও রোল</button>
    <button class="cat-btn" onclick="filterCat('others', this)">অন্যান্য</button>
  </div>

  <!-- Menu List -->
  <div class="menu-container" id="menu-list"></div>

  <!-- Bottom Drawer -->
  <div class="cart-drawer">
    <div class="customer-inputs">
      <input type="text" id="cust-name" class="input-name" placeholder="আপনার নাম..." />
      <input type="text" id="cust-detail" class="input-detail" placeholder="টেবিল / ফোন নং..." />
    </div>
    <div class="cart-action">
      <div class="total-box">
        <span class="total-count" id="item-count">০ টি আইটেম</span>
        <span class="total-amount" id="total-price">₹০</span>
      </div>
      <button class="order-btn" id="order-btn" onclick="sendWhatsAppOrder()" disabled>
        হোয়াটসঅ্যাপে অর্ডার করুন 📲
      </button>
    </div>
  </div>

      {

        portions: [

          { key: "poach_double", label: "দুটি ডিম", price: 25 }
        ]
      },
      {

        cat: "others",
        name: "সেদ্ধ ডিম (Boiled Egg)",
        catLabel: "অন্যান্য",
        portions: [
          { key: "boiled_single", label: "একটি ডিম", price: 15 },
          { key: "boiled_double", label: "দুটি ডিম", price: 25 }
        ]
      },
      {
        id: "oth_soup",
        cat: "others",
        name: "মিক্স ভেজ স্যুপ (Mix Veg Soup)",
        catLabel: "অন্যান্য",
        portions: [
          { key: "soup_bowl", label: "প্রতি বাটি", price: 5 }
        ]
      },
      {
        id: "oth_spring_roll",
        cat: "others",
        name: "ভেজ স্প্রিং রোল (Veg Spring Roll)",
        catLabel: "অন্যান্য",
        portions: [
          { key: "s_roll_1", label: "১ পিস", price: 20 }
        ]
      },
      {
        id: "oth_drink",
        cat: "others",
        name: "গোল্ড ড্রিংক / জল (Gold Drink / Water)",
        catLabel: "অন্যান্য",
        portions: [
          { key: "drink_1", label: "প্রতি বোতল", price: 20 }
        ]
      }
    ];

    const cart = {};

    function renderMenu(filter = "all") {
      const container = document.getElementById("menu-list");
      container.innerHTML = "";

      const filtered = filter === "all" ? menuData : menuData.filter(i => i.cat === filter);

      filtered.forEach(item => {
        const card = document.createElement("div");
        card.className = "item-card";

        let portionsHtml = "";
        item.portions.forEach(p => {
          const qty = cart[p.key] || 0;
          portionsHtml += `
            <div class="portion-row">
              <div>
                <span class="portion-label">${p.label}</span>
                <span class="portion-price">₹${p.price}</span>
              </div>
              <div class="counter">
                <button onclick="updateQty('${p.key}', -1)">-</button>
                <span class="qty-display" id="qty-${p.key}">${qty}</span>
                <button onclick="updateQty('${p.key}', 1)">+</button>
              </div>
            </div>
          `;
        });

        card.innerHTML = `
          <div class="item-title">${item.name}</div>
          <div class="item-cat">${item.catLabel}</div>
          ${portionsHtml}
        `;
        container.appendChild(card);
      });
    }

    function filterCat(cat, btn) {
      document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      renderMenu(cat);
    }

    function updateQty(key, delta) {
      const current = cart[key] || 0;
      const updated = Math.max(0, current + delta);
      if (updated === 0) {
        delete cart[key];
      } else {
        cart[key] = updated;
      }

      const display = document.getElementById(`qty-${key}`);
      if (display) display.innerText = updated;

      updateSummary();
    }

    function updateSummary() {
      let totalQty = 0;
      let totalPrice = 0;

      menuData.forEach(item => {
        item.portions.forEach(p => {
          const count = cart[p.key] || 0;
          if (count > 0) {
            totalQty += count;
            totalPrice += count * p.price;
          }
        });
      });

      document.getElementById("item-count").innerText = `${totalQty} টি আইটেম`;
      document.getElementById("total-price").innerText = `₹${totalPrice}`;
      document.getElementById("order-btn").disabled = totalQty === 0;
    }

    function sendWhatsAppOrder() {
      const name = document.getElementById("cust-name").value.trim() || "গ্রাহক (Customer)";
      const detail = document.getElementById("cust-detail").value.trim() || "Not specified";

      let itemsText = "";
      let grandTotal = 0;

      menuData.forEach(item => {
        item.portions.forEach(p => {
          const count = cart[p.key] || 0;
          if (count > 0) {
            const cost = count * p.price;
            grandTotal += cost;
            itemsText += `• ${item.name} (${p.label}) x ${count} = ₹${cost}\n`;
          }
        });
      });

      const message = `🥟 *রিতা মোমো মার্ট - নতুন অর্ডার* 🥟\n` +
                      `━━━━━━━━━━━━━━━━\n` +
                      `👤 *নাম:* ${name}\n` +
                      `📍 *টেবিল/ফোন:* ${detail}\n` +
                      `━━━━━━━━━━━━━━━━\n` +
                      `📋 *অর্ডার লিস্ট:*\n${itemsText}` +
                      `━━━━━━━━━━━━━━━━\n` +
                      `💰 *মোট বিল:* ₹${grandTotal}\n\n` +
                      `দয়া করে অর্ডারটি কনফার্ম করুন!`;

      const encoded = encodeURIComponent(message);
      window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encoded}`, "_blank");
    }

    renderMenu("all");
  </script>
</body>
