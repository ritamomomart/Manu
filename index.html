<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rita Momo Mart - Live Digital Menu & Order</title>
    <!-- Firebase App & Firestore SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; margin: 0; padding: 10px; padding-bottom: 90px; }
        .header { text-align: center; padding: 15px; background: #1f1f1f; border-radius: 8px; margin-bottom: 15px; }
        .item-card { background: #1e1e1e; border: 1px solid #333; border-radius: 8px; padding: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .badge-in { background: #d4edda; color: #155724; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .badge-out { background: #f8d7da; color: #721c24; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .qty-box { display: flex; align-items: center; gap: 8px; margin-top: 5px; }
        .qty-btn { background: #333; color: #fff; border: none; padding: 5px 10px; font-size: 16px; border-radius: 4px; cursor: pointer; }
        .cart-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #1f1f1f; border-top: 2px solid #333; padding: 15px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 -4px 10px rgba(0,0,0,0.5); }
        .order-btn { background: #25D366; color: #000; border: none; padding: 10px 20px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; text-decoration: none; }
    </style>
</head>
<body>

    <div class="header">
        <h2>রীতা মোমো মার্ট (Rita Momo Mart)</h2>
        <p>Narayan Pur (Mill More), Buniadpur</p>
        <p style="font-size: 13px; color: #ccc;">Call: 9485949685, 9911437053, 8383923530</p>
        <a href="https://maps.app.goo.gl/AxpKtAtTFicX6jmo7" target="_blank" style="color: #4da6ff; font-size: 14px;">📍 View on Google Maps</a>
    </div>

    <div id="menu-container">
        <p style="text-align: center; color: #aaa;">Loading live menu...</p>
    </div>

    <!-- Floating Cart & Checkout Bar -->
    <div class="cart-bar">
        <div>
            <span id="cart-count" style="font-weight: bold; font-size: 15px;">0 Items</span> | 
            <span id="cart-total" style="color: #25D366; font-weight: bold; font-size: 16px;">₹0</span>
        </div>
        <a id="whatsapp-order-btn" href="#" onclick="sendWhatsAppOrder(event)" class="order-btn">Proceed to Order 🛒</a>
    </div>

    <script>
        const firebaseConfig = { projectId: "restaurantpos-vbmk" };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.firestore();

        let menuItems = [];
        let cart = {}; // itemId -> quantity

        const defaultItems = [
            { id: "1", name: "Veg. Steam Momos", category: "Momos", price: 40, isAvailable: true },
            { id: "2", name: "Veg. Fried Momos", category: "Momos", price: 50, isAvailable: true },
            { id: "3", name: "Veg. Kurkure Momos", category: "Momos", price: 70, isAvailable: true },
            { id: "4", name: "Chicken Steam Momos", category: "Momos", price: 60, isAvailable: true },
            { id: "5", name: "Chicken Fried Momos", category: "Momos", price: 70, isAvailable: true },
            { id: "6", name: "Chowmin (Veg)", category: "Chowmin", price: 40, isAvailable: true },
            { id: "7", name: "Burger (Aloo Tikki)", category: "Burger", price: 30, isAvailable: true },
            { id: "8", name: "Aloo Chop (Pakoda)", category: "Pakoda", price: 5, isAvailable: true }
        ];

        function renderMenu(itemsList) {
            menuItems = itemsList;
            const container = document.getElementById("menu-container");
            container.innerHTML = "";
            
            itemsList.forEach((item, index) => {
                const itemId = item.id || index;
                const itemName = item.name || item.title || "Food Item";
                const itemPrice = item.price || item.fullPrice || 40;
                const isInStock = item.isAvailable !== false;
                const qty = cart[itemId] || 0;
                
                const card = document.createElement("div");
                card.className = "item-card";
                card.innerHTML = `
                    <div>
                        <strong style="font-size: 15px;">${itemName}</strong><br>
                        <span style="color: #25D366; font-size: 14px; font-weight: bold;">₹${itemPrice}</span><br>
                        <span class="${isInStock ? 'badge-in' : 'badge-out'}">${isInStock ? 'In Stock' : 'Out of Stock'}</span>
                    </div>
                    <div>
                        ${isInStock ? `
                            <div class="qty-box">
                                <button class="qty-btn" onclick="updateQty('${itemId}', -1)">-</button>
                                <span style="font-size: 16px; font-weight: bold; width: 20px; text-align: center;">${qty}</span>
                                <button class="qty-btn" onclick="updateQty('${itemId}', 1)">+</button>
                            </div>
                        ` : '<span style="color:#777; font-size:12px;">Unavailable</span>'}
                    </div>
                `;
                container.appendChild(card);
            });
            updateCartBar();
        }

        window.updateQty = function(id, change) {
            if (!cart[id]) cart[id] = 0;
            cart[id] += change;
            if (cart[id] < 0) cart[id] = 0;
            if (cart[id] === 0) delete cart[id];
            renderMenu(menuItems);
        };

        function updateCartBar() {
            let totalCount = 0;
            let totalPrice = 0;

            for (let id in cart) {
                const item = menuItems.find((it, idx) => (it.id || idx) == id);
                if (item) {
                    totalCount += cart[id];
                    totalPrice += (item.price || item.fullPrice || 40) * cart[id];
                }
            }

            document.getElementById("cart-count").innerText = `${totalCount} Items`;
            document.getElementById("cart-total").innerText = `₹${totalPrice}`;
        }

        window.sendWhatsAppOrder = function(e) {
            let totalCount = 0;
            let totalPrice = 0;
            let orderText = "👋 Hi Rita Momo Mart! I want to place a new order:%0A%0A";

            for (let id in cart) {
                const item = menuItems.find((it, idx) => (it.id || idx) == id);
                if (item) {
                    const q = cart[id];
                    const p = (item.price || item.fullPrice || 40) * q;
                    totalCount += q;
                    totalPrice += p;
                    orderText += `▪️ ${item.name || item.title} x ${q} = ₹%0A`;
                }
            }

            if (totalCount === 0) {
                e.preventDefault();
                alert("Please select at least one item to order!");
                return;
            }

            orderText += `%0A*Total Amount: ₹${totalPrice}*%0A%0APlease confirm my order!`;
            const waUrl = `https://wa.me/919485949685?text=${orderText}`;
            document.getElementById("whatsapp-order-btn").href = waUrl;
        };

        // Fetch from Firestore or fallback
        db.collection("rooms").doc("RITA-MOMO-88").collection("items").get()
            .then((snapshot) => {
                if (!snapshot.empty) {
                    let items = [];
                    snapshot.forEach(doc => {
                        let data = doc.data();
                        data.id = doc.id;
                        items.push(data);
                    });
                    renderMenu(items);
                } else {
                    renderMenu(defaultItems);
                }
            })
            .catch(() => {
                renderMenu(defaultItems);
            });
    </script>
</body>
</html>
