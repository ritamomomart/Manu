<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rita Momo Mart - Live Digital Menu</title>
    <!-- Firebase App & Firestore SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; margin: 0; padding: 10px; }
        .header { text-align: center; padding: 15px; background: #1f1f1f; border-radius: 8px; margin-bottom: 15px; }
        .item-card { background: #1e1e1e; border: 1px solid #333; border-radius: 8px; padding: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .badge-in { background: #d4edda; color: #155724; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .badge-out { background: #f8d7da; color: #721c24; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .contact-box { background: #222; padding: 15px; border-radius: 8px; margin-top: 20px; text-align: center; font-size: 14px; }
        .contact-box a { color: #25D366; text-decoration: none; font-weight: bold; font-size: 16px; }
    </style>
</head>
<body>

    <div class="header">
        <h2>রীতা মোমো মার্ট (Rita Momo Mart)</h2>
        <p>Narayan Pur (Mill More), Buniadpur</p>
        <p>Call: 9485949685, 9911437053, 8383923530</p>
        <a href="https://maps.app.goo.gl/AxpKtAtTFicX6jmo7" target="_blank" style="color: #4da6ff;">📍 View on Google Maps</a>
    </div>

    <div id="menu-container">
        <p style="text-align: center; color: #aaa;">Loading menu...</p>
    </div>

    <div class="contact-box">
        <p>🛒 Order Directly on WhatsApp:</p>
        <a href="https://wa.me/919485949685?text=Hi%20Rita%20Momo%20Mart!%20I%20want%20to%20order%20food">Chat on WhatsApp (9485949685)</a>
    </div>

    <script>
        const firebaseConfig = {
            projectId: "restaurantpos-vbmk"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // Default menu items fallback in case Firestore rules restrict direct web read
        const defaultItems = [
            { name: "Veg. Steam Momos", category: "Momos", isAvailable: true },
            { name: "Veg. Fried Momos", category: "Momos", isAvailable: true },
            { name: "Veg. Kurkure Momos", category: "Momos", isAvailable: true },
            { name: "Veg. Tandoori Momos", category: "Momos", isAvailable: true },
            { name: "Chicken Steam Momos", category: "Momos", isAvailable: true },
            { name: "Chicken Fried Momos", category: "Momos", isAvailable: true },
            { name: "Chicken Kurkure Momos", category: "Momos", isAvailable: true },
            { name: "Chicken Tandoori Momos", category: "Momos", isAvailable: true },
            { name: "Chowmin (Veg)", category: "Chowmin, Burger, Roll", isAvailable: true },
            { name: "Burger (Aloo Tikki)", category: "Chowmin, Burger, Roll", isAvailable: true },
            { name: "Aloo Chop (Pakoda)", category: "Pakoda", isAvailable: true },
            { name: "Beguni", category: "Pakoda", isAvailable: true }
        ];

        function renderMenu(itemsList) {
            const container = document.getElementById("menu-container");
            container.innerHTML = "";
            
            itemsList.forEach((item) => {
                const itemName = item.name || item.title || "Food Item";
                const itemCat = item.category || "General";
                const isInStock = item.isAvailable !== false;
                
                const card = document.createElement("div");
                card.className = "item-card";
                card.innerHTML = `
                    <div>
                        <strong style="font-size: 16px;">${itemName}</strong><br>
                        <small style="color: #aaa;">Category: ${itemCat}</small>
                    </div>
                    <div>
                        <span class="${isInStock ? 'badge-in' : 'badge-out'}">
                            ${isInStock ? 'In Stock' : 'Out of Stock'}
                        </span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Try fetching from Firestore, fallback to default items if permission denied or empty
        db.collection("rooms").doc("RITA-MOMO-88").collection("items").get()
            .then((snapshot) => {
                if (!snapshot.empty) {
                    let items = [];
                    snapshot.forEach(doc => items.push(doc.data()));
                    renderMenu(items);
                } else {
                    renderMenu(defaultItems);
                }
            })
            .catch((error) => {
                console.log("Using fallback menu due to Firestore rule limit:", error);
                renderMenu(defaultItems);
            });
    </script>
</body>
</html>
